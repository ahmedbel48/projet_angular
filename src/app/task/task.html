<h2>Mes tâches</h2>
<p>{{ count() }} tâche(s)</p>

<input
  type="text"
  placeholder="Nouvelle tâche"
  [value]="newTitle()"
  (input)="onInput($event)"
/>
<button (click)="add()">Ajouter</button>
<button (click)="clear()">Vider</button>

<ul>
  @for (task of tasks(); track task.id) {
    <li>{{ task.title }}</li>
  } @empty {
    <li>Aucune tâche</li>
  }
</ul>
